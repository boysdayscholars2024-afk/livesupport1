<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Support | Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
        position: fixed; top:0; left:0; width:100%; height:100%;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index: 100;
    }
    .login-box {
        background: #1e293b; padding: 2.2rem 2rem; border-radius: 14px; width: 320px;
        text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    .login-box i.fa-headset { font-size: 2.6rem; color: #25D366; margin-bottom: 10px; }
    .login-box h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .login-box p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    .login-box input {
        width: 100%; padding: 12px; margin-bottom: 14px; background: #334155; border: none;
        border-radius: 8px; color: white; outline: none; font-size: 0.95rem;
    }
    .login-box button {
        width: 100%; padding: 12px; background: linear-gradient(145deg, #25D366, #1ebe57);
        border: none; border-radius: 8px; color: white; font-weight: 800; cursor: pointer;
        font-size: 0.95rem; transition: 0.2s;
    }
    .login-box button:hover { transform: translateY(-2px); }
    .login-error { color: #ef4444; font-size: 0.82rem; margin-top: 10px; display: none; }

    /* ===== DASHBOARD SHELL (Phase 1) ===== */
    #dashboard { display: none; max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
    .dash-header {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(0,0,0,0.8); padding: 1.1rem 1.5rem; border-radius: 10px;
        border-left: 6px solid #25D366; margin-bottom: 1.5rem;
    }
    .dash-header h1 { font-size: 1.3rem; display:flex; align-items:center; gap:10px; }
    .dash-header h1 i { color: #25D366; }
    #logoutBtn { background: #334155; border: none; color: white; padding: 8px 16px;
        border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    #logoutBtn:hover { background: #475569; }

    .status-strip { display: flex; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .status-pill {
        flex: 1; min-width: 140px; background: #1e293b; border-radius: 10px; padding: 14px 16px;
        border: 1px solid #334155;
    }
    .status-pill .num { font-size: 1.5rem; font-weight: 800; }
    .status-pill .label { color: #94a3b8; font-size: 0.8rem; }
    .status-pill.online .num { color: #25D366; }

    .requests-section { background: #1e293b; border-radius: 12px; padding: 1.3rem; border: 1px solid #334155; }
    .requests-section h3 { font-size: 1rem; margin-bottom: 1rem; display:flex; align-items:center; gap:8px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
    .empty-state i { font-size: 2.5rem; margin-bottom: 10px; display: block; color: #475569; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
    <div class="login-box">
        <i class="fas fa-headset"></i>
        <h2>Live Support</h2>
        <p>Admin Dashboard — sirf Ankush ke liye</p>
        <input type="password" id="adminPassInput" placeholder="Password" autocomplete="off">
        <button id="adminLoginBtn">Login</button>
        <div class="login-error" id="loginErrorMsg">Galat password! Dobara try karo.</div>
    </div>
</div>

<!-- ===== DASHBOARD (Phase 1: shell only) ===== -->
<div id="dashboard">
    <div class="dash-header">
        <h1><i class="fas fa-headset"></i> Live Support Dashboard</h1>
        <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="status-strip">
        <div class="status-pill online"><div class="num" id="statOnline">🟢</div><div class="label">Server Status</div></div>
        <div class="status-pill"><div class="num" id="statRequests">0</div><div class="label">Active Requests</div></div>
        <div class="status-pill"><div class="num" id="statWaiting">0</div><div class="label">Waiting</div></div>
    </div>

    <div class="requests-section">
        <h3><i class="fas fa-inbox"></i> Incoming Requests</h3>
        <div id="requestsList">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                Abhi koi active chat/call request nahi hai.<br>
                <small>(Phase 2/3 me yahan real-time requests dikhna shuru hongi)</small>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Phase 1: simple password gate (client-side, session-only, no persistence) =====
    // 👉 Password change karna ho to sirf yahan neeche wali line edit karo:
    const ADMIN_PASSWORD = "Ankush@2026";

    const loginScreen = document.getElementById("loginScreen");
    const dashboard = document.getElementById("dashboard");
    const adminPassInput = document.getElementById("adminPassInput");
    const loginErrorMsg = document.getElementById("loginErrorMsg");

    function tryLogin() {
        if (adminPassInput.value === ADMIN_PASSWORD) {
            loginScreen.style.display = "none";
            dashboard.style.display = "block";
        } else {
            loginErrorMsg.style.display = "block";
        }
    }

    document.getElementById("adminLoginBtn").addEventListener("click", tryLogin);
    adminPassInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        dashboard.style.display = "none";
        loginScreen.style.display = "flex";
        adminPassInput.value = "";
        loginErrorMsg.style.display = "none";
    });
</script>
</body>
</html>
